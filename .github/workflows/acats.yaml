
name: ACATS
on: push

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/godunko/espidf-alire:main
    strategy:
      fail-fast: false
      matrix:
        esp32_mcu: [esp32s3]
        bundle: [bundle_a, bundle_c2, bundle_c3, bundle_c4, bundle_c5, bundle_c6, bundle_c7, bundle_c8, bundle_c9, bundle_ca]
    steps:
    - name: Display environment
      run: |
        alr settings --global
        . $IDF_PATH/export.sh

    - name: Checkout repo
      uses: actions/checkout@v4
      with:
        path: components/espidf_gnat_runtime
    - name: Checkout GNAT Runtime ACATS Testsuite repo
      uses: actions/checkout@v4
      with:
        repository: godunko/espidf_gnat_runtime_acats
        path: crates/espidf_gnat_runtime_acats
    - name: Checkout A0B Tools
      uses: actions/checkout@v4
      with:
        repository: godunko/a0b-tools
        path: crates/a0b-tools
    - name: Checkout Xtensa Dynconfig
      uses: actions/checkout@v4
      with:
        repository: godunko/xtensa-dynconfig
        path: crates/xtensa-dynconfig
    - name: Checkout `bb-runtimes` for FSF GCC 16
      uses: actions/checkout@v4
      with:
        repository: alire-project/bb-runtimes
        ref: gnat-fsf-16
        path: crates/bb-runtimes

    - name: Build Xtensa Dynconfig
      run: |
        alr -C crates/xtensa-dynconfig --non-interactive with --solve
        alr -C crates/xtensa-dynconfig build
    - name: Build A0B Tools
      run: |
        alr -C crates/a0b-tools --non-interactive with --solve
        alr -C crates/a0b-tools build
    - name: Select Alire toolchain
      run: |
        alr toolchain --select gnat_xtensa_esp32_elf

    - name: Build and Run tests
      shell: bash
      run: |
        . $IDF_PATH/export.sh
        cd crates/espidf_gnat_runtime_acats/${{ matrix.bundle }}
        idf.py set-target ${{ matrix.esp32_mcu }}
        idf.py qemu --qemu-extra-args --no-reboot | tee log
        ../support/report.sh log ${{ matrix.esp32_mcu }}

    - name: Publish Test Report
      uses: ctrf-io/github-test-reporter@v1
      with:
        report-path: 'crates/espidf_gnat_runtime_acats/${{ matrix.bundle }}/*.json'
        github-report: true
        upload-artifact: true
        artifact-name: 'ctrf-report-${{ matrix.esp32_mcu }}-${{ matrix.bundle }}'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      if: always()
